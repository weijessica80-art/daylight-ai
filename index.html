<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Daylight AI"><link rel="manifest" href="manifest.webmanifest"><title>Daylight AI</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172039;background:#f5f6fb}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}header{padding:35px 22px 14px;max-width:720px;margin:auto}h1{font-size:31px;margin:5px 0}h2{font-size:20px;margin:0 0 13px}.muted{color:#778098;font-size:13px}.eyebrow{color:#6665b5;font-weight:700;font-size:12px;letter-spacing:1.5px}.shell{max-width:720px;margin:auto;padding:0 18px 100px}.card{background:white;border:1px solid #e9ebf2;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #26345409}.hero{background:linear-gradient(130deg,#383c85,#8274c9);color:white;padding:22px}.hero .muted{color:#e2ddff}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{display:inline-block;padding:5px 10px;border-radius:30px;background:#f0efff;color:#5b51a5;font-size:12px}.btn{border:0;border-radius:13px;background:#6258b7;color:white;padding:11px 15px;font-weight:650}.btn.secondary{background:#f0effb;color:#5a53a6}.item{padding:12px 0;border-bottom:1px solid #eff0f4}.item:last-child{border:0}.item p{margin:5px 0;color:#737b8d;font-size:13px}.check{width:20px;height:20px;accent-color:#665bb9}.done{text-decoration:line-through;color:#8a90a0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid #e9eaf0;display:flex;justify-content:space-around;padding:9px 4px calc(8px + env(safe-area-inset-bottom));z-index:3}.tabs button{border:0;background:transparent;color:#858a9c;font-size:10px;display:grid;gap:4px;justify-items:center}.tabs button.active{color:#5d54b2;font-weight:750}.tabs .ico{font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f6f5fc;padding:13px;border-radius:15px}.stat strong{display:block;font-size:23px}.field{width:100%;border:1px solid #dfe2ec;border-radius:12px;padding:12px;margin:5px 0 12px;background:#fff;color:#172039}label{font-size:13px;font-weight:650}.notice{background:#fff7e8;color:#7d5c26;padding:12px;border-radius:12px;font-size:12px;line-height:1.5}.empty{color:#81879b;text-align:center;padding:28px 0}textarea{min-height:110px}footer{padding:18px 0;text-align:center;color:#9195a4;font-size:11px}</style></head><body><header><div class="row"><span class="eyebrow">✦ DAYLIGHT AI</span><span class="pill">Local prototype</span></div><h1 id="title">Good morning ☀️</h1><div class="muted">Your day, thoughtfully organized.</div></header><main class="shell" id="main"></main><nav class="tabs" id="tabs"></nav><script>
const KEY='daylight_v1',initial={tasks:[{id:'t1',title:'Palo Alto Enjoy! winter resident registration',due:'2026-12-03T10:00',category:'Personal',done:false},{id:'t2',title:'Review Stella’s school application deadlines',due:'',category:'School',done:false},{id:'t3',title:'Plan next robotics prototype milestone',due:'',category:'Projects',done:false}],schools:[{name:'Synapse',status:'Application in progress',note:'Review required forms and deadlines'},{name:'Keys',status:'Tour / application tracking',note:'Check parent tour availability'},{name:'Nueva',status:'Considering',note:'Decide whether to apply this cycle'},{name:'Sacred Heart',status:'To review',note:'Confirm admissions steps'},{name:'Pinewood',status:'To review',note:'Confirm tour dates'},{name:'Duveneck',status:'Public school',note:'Track enrollment timeline'}],projects:[{name:'Robotics learning',detail:'LeRobot hardware, training and experiments',status:'Active'},{name:'Koru bot concept',detail:'Child-safe companion robotics product',status:'Exploring'},{name:'Home expansion',detail:'Layout, parent suite and budget planning',status:'Planning'}],emails:[{subject:'School tour follow-up',to:'',body:'Hello,\n\nCould you share upcoming parent tour availability?\n\nThank you!'}]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){state=structuredClone(initial)};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));let tab='Today';const tabs=[['Today','☀️'],['Calendar','📅'],['School','🎓'],['Email','✉️'],['Tasks','☑️'],['More','◫']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>d?new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'No due date';const taskHtml=t=>'<div class="item row"><div class="row"><input class="check" type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask(\''+t.id+'\')"><div><strong class="'+(t.done?'done':'')+'">'+esc(t.title)+'</strong><p>'+esc(t.category)+' · '+fmt(t.due)+'</p></div></div><button class="btn secondary" onclick="deleteTask(\''+t.id+'\')">×</button></div>';function render(){document.getElementById('title').textContent=tab==='Today'?'Good morning ☀️':tab;document.getElementById('tabs').innerHTML=tabs.map(([t,i])=>'<button class="'+(tab===t?'active':'')+'" onclick="go(\''+t+'\')"><span class="ico">'+i+'</span>'+t+'</button>').join('');let h='',open=state.tasks.filter(t=>!t.done);if(tab==='Today')h='<section class="card hero"><div class="muted">YOUR DAILY BRIEFING</div><h2 style="font-size:26px;margin:12px 0">'+open.length+' things on your list</h2><p>Stay ahead of school deadlines, family plans and personal projects.</p><button class="btn secondary" onclick="go(\'Tasks\')">Review tasks →</button></section><div class="grid"><div class="stat">Open tasks<strong>'+open.length+'</strong></div><div class="stat">Schools tracked<strong>'+state.schools.length+'</strong></div></div><section class="card"><h2>Up next</h2>'+open.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,4).map(taskHtml).join('')+'<button class="btn" onclick="newTask()">+ Add task</button></section><section class="card"><h2>Agent status</h2><p class="muted">Gmail, calendars, finances and background monitoring are not connected.</p></section>';if(tab==='Calendar')h='<section class="card"><h2>Upcoming reminders</h2>'+state.tasks.filter(t=>t.due&&!t.done).map(taskHtml).join('')+'<button class="btn" onclick="newTask()">+ Reminder</button></section><div class="notice">Local task dates do not trigger push notifications. Use iPhone Reminders for critical alerts.</div>';if(tab==='Tasks')h='<section class="card"><h2>All tasks</h2>'+state.tasks.map(taskHtml).join('')+'<button class="btn" onclick="newTask()">+ New task</button></section><section class="card"><h2>Monitoring</h2><p class="muted">Automatic checks require a connected backend.</p></section>';if(tab==='School')h='<section class="card"><h2>Stella’s school applications</h2><p class="muted">Editable planning notes, not live admissions records.</p>'+state.schools.map((s,i)=>'<div class="item"><div class="row"><strong>'+esc(s.name)+'</strong><span class="pill">'+esc(s.status)+'</span></div><p>'+esc(s.note)+'</p><button class="btn secondary" onclick="editSchool('+i+')">Edit</button></div>').join('')+'<button class="btn" onclick="addSchool()">+ School</button></section>';if(tab==='Email')h='<section class="card"><h2>Email drafts</h2><div class="notice">No inbox connected. Messages are not sent automatically.</div><label>To</label><input id="emailTo" class="field" value="'+esc(state.emails[0].to)+'"><label>Subject</label><input id="emailSubject" class="field" value="'+esc(state.emails[0].subject)+'"><label>Message</label><textarea id="emailBody" class="field">'+esc(state.emails[0].body)+'</textarea><button class="btn secondary" onclick="saveDraft()">Save draft</button> <button class="btn" onclick="shareDraft()">Open Mail</button></section>';if(tab==='More')h='<section class="card"><h2>Personal projects</h2>'+state.projects.map((p,i)=>'<div class="item"><div class="row"><strong>'+esc(p.name)+'</strong><span class="pill">'+esc(p.status)+'</span></div><p>'+esc(p.detail)+'</p><button class="btn secondary" onclick="editProject('+i+')">Edit</button></div>').join('')+'<button class="btn" onclick="addProject()">+ Project</button></section><section class="card"><h2>Financial overview</h2><div class="notice">No financial accounts connected. Do not enter sensitive information.</div><div class="grid"><div class="stat">Connected accounts<strong>0</strong></div><div class="stat">Live balances<strong>—</strong></div></div></section><section class="card"><h2>Local data</h2><p class="muted">Your edits are saved on this device, not in GitHub.</p><button class="btn" onclick="exportData()">Export backup</button></section>';document.getElementById('main').innerHTML=h+'<footer>Daylight AI · Local prototype</footer>'}function go(t){tab=t;render();scrollTo(0,0)}function newTask(){let title=prompt('Task title');if(!title)return;let due=prompt('Due date (YYYY-MM-DDTHH:MM), optional')||'';state.tasks.push({id:'t'+Date.now(),title,due,category:'Personal',done:false});save();render()}function toggleTask(id){let t=state.tasks.find(t=>t.id===id);if(t)t.done=!t.done;save();render()}function deleteTask(id){if(confirm('Delete task?')){state.tasks=state.tasks.filter(t=>t.id!==id);save();render()}}function editSchool(i){let s=state.schools[i],v=prompt('Status',s.status);if(v===null)return;s.status=v;v=prompt('Notes',s.note);if(v!==null)s.note=v;save();render()}function addSchool(){let name=prompt('School name');if(name){state.schools.push({name,status:'To review',note:''});save();render()}}function editProject(i){let p=state.projects[i],v=prompt('Status',p.status);if(v===null)return;p.status=v;v=prompt('Notes',p.detail);if(v!==null)p.detail=v;save();render()}function addProject(){let name=prompt('Project name');if(name){state.projects.push({name,status:'Planning',detail:''});save();render()}}function saveDraft(){state.emails[0]={to:emailTo.value,subject:emailSubject.value,body:emailBody.value};save();alert('Draft saved on this device')}function shareDraft(){saveDraft();location.href='mailto:'+encodeURIComponent(emailTo.value)+'?subject='+encodeURIComponent(emailSubject.value)+'&body='+encodeURIComponent(emailBody.value)}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='daylight-backup.json';a.click()}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
