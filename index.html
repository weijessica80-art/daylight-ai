const KEY='daylight_v1',initial={tasks:[{id:'t1',title:'Palo Alto Enjoy! winter resident registration',due:'2026-12-03T10:00',category:'Personal',done:false},{id:'t2',title:'Review Stella’s school application deadlines',due:'',category:'School',done:false},{id:'t3',title:'Plan next robotics prototype milestone',due:'',category:'Projects',done:false}],schools:[{name:'Synapse',status:'Application in progress',note:'Review required forms and deadlines'},{name:'Keys',status:'Tour / application tracking',note:'Check parent tour availability'},{name:'Nueva',status:'Considering',note:'Decide whether to apply this cycle'},{name:'Sacred Heart',status:'To review',note:'Confirm admissions steps'},{name:'Pinewood',status:'To review',note:'Confirm tour dates'},{name:'Duveneck',status:'Public school',note:'Track enrollment timeline'}],projects:[{name:'Robotics learning',detail:'LeRobot hardware, training and experiments',status:'Active'},{name:'Koru bot concept',detail:'Child-safe companion robotics product',status:'Exploring'},{name:'Home expansion',detail:'Layout, parent suite and budget planning',status:'Planning'}],emails:[{subject:'School tour follow-up',to:'',body:'Hello,\n\nCould you share upcoming parent tour availability?\n\nThank you!'}]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){state=structuredClone(initial)};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));let tab='Today';const tabs=[['Today','☀️'],['Calendar','📅'],['School','🎓'],['Email','✉️'],['Tasks','☑️'],['More','◫']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>d?new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'No due date';const taskHtml=t=>'<div class="item row"><div class="row"><input class="check" type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask(\''+t.id+'\')"><div><strong class="'+(t.done?'done' >'+esc(s.note)+'</p><button class="btn secondary" onclick="editSchool('+i+')">Edit</button></div>').join('')+'<button class="btn" onclick="addSchool()">+ School</button></section>';if(tab==='Email')h='<section class="card"><h2>Email drafts</h2><div class="notice">No inbox connected. Messages are not sent automatically.</div><label>To</label><input id="emailTo" class="field" value="'+esc(state.emails[0].to)+'"><label>Subject</label><input id="emailSubject" class="field" value="'+esc(state.emails[0].subject)+'"><label>Message</label><textarea id="emailBody" class="field">'+esc(state.emails[0].body)+'</textarea><button class="btn secondary" onclick="saveDraft()">Save draft</button> <button class="btn" onclick="shareDraft()">Open Mail</button></section>';if(tab==='More')h='<section class="card"><h2>Personal projects</h2>'+state.projects.map((p,i)=>'<div class="item"><div class="row"><strong>'+esc(p.name)+'</strong><span class="pill">'+esc(p.status)+'</span></div><p>'+esc(p.detail)+'</p><button class="btn secondary" onclick="editProject('+i+')">Edit</button></div>').join('')+'<button class="btn" onclick="addProject()">+ Project</button></section><section class="card"><h2>Financial overview</h2><div class="notice">No financial accounts connected. Do not enter sensitive information.</div><div class="grid"><div class="stat">Connected accounts<strong>0</strong></div><div class="stat">Live balances<strong>—</strong></div></div></section><section class="card"><h2>Local data</h2><p class="muted">Your edits are saved on this device, not in GitHub.</p><button class="btn" onclick="exportData()">Export backup</button></section>';document.getElementById('main').innerHTML=h+'<footer>Daylight AI · Local prototype</footer>'}function go(t){tab=t;render();scrollTo(0,0)}function newTask(){let title=prompt('Task title');if(!title)return;let due=prompt('Due date (YYYY-MM-DDTHH:MM), optional')||'';state.tasks.push({id:'t'+Date.now(),title,due,category:'Personal',done:false});save();render()}
